    const HTML_LANG = { ko: "ko", zh: "zh-Hans", en: "en", ja: "ja" };
    let lang = "ko";

    function render(next) {
      lang = I18N[next] ? next : "ko";
      const d = I18N[lang];
      document.documentElement.lang = HTML_LANG[lang];
      document.title = d.doc;
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const k = el.dataset.i18n;
        el.innerHTML = k.startsWith("tab.") ? d.tab[k.slice(4)] : d[k];
      });
      document.getElementById("photo").alt = d.name;
      document.getElementById("sections").innerHTML = d.sections.map(([h, sub, ps], i) =>
        `<section><h2><span class="n">${String(i + 1).padStart(2, "0")}</span>${h}</h2><p class="sub">${sub}</p>${ps.map(p => `<p>${p}</p>`).join("")}</section>`).join("");
      document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
      // 열려 있는 포트폴리오 탭도 같은 언어로 다시 불러옴
      ["classic", "channel"].forEach(k => { const fr = document.getElementById("panel-" + k); if (fr.src) fr.src = PANEL_SRC[k] + "?lang=" + lang; });
      try { localStorage.setItem("lang", lang); } catch (e) {}
    }
    document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => render(b.dataset.lang)));
    // 탭: 자기소개서 / 기존 포트폴리오 / 채널 포트폴리오 (포트폴리오는 같은 페이지 안에 띄움)
    const PANEL_SRC = { classic: "../index.html", channel: "../channel/index.html" };
    function showTab(name) {
      document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === name)));
      document.getElementById("panel-letter").hidden = name !== "letter";
      ["classic", "channel"].forEach(k => {
        const fr = document.getElementById("panel-" + k);
        fr.hidden = name !== k;
        if (name === k && !fr.src) fr.src = PANEL_SRC[k] + "?lang=" + lang;
      });
      document.querySelector(".lang").style.visibility = name === "letter" ? "" : "hidden";
      window.scrollTo(0, 0);
      try { history.replaceState(null, "", "#" + name); } catch (e) {}
    }
    document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));
    document.getElementById("print-btn").addEventListener("click", () => window.print());

    let saved = new URLSearchParams(location.search).get("lang");
    if (!I18N[saved]) { try { saved = localStorage.getItem("lang"); } catch (e) {} }
    render(I18N[saved] ? saved : "ko");
    showTab(["classic", "channel"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "letter");
  </script>
