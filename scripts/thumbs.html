<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<!-- 썸네일 템플릿
     가로: thumbs.html?id=shenyang&lang=ko → 1280x720
     세로 카드뉴스 표지: thumbs.html?id=s-wok&lang=ko → 720x1280
     썸네일마다 레이아웃·색·글꼴을 다르게 하고, 한국어·중국어·영어(일본어 버전은 일본어·중국어·영어)를 섞어 씀.
     scripts/build-thumbs.ps1 로 일괄 생성 -->
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Noto+Sans+KR:wght@700;900&family=Noto+Sans+SC:wght@700;900&family=Noto+Sans+JP:wght@700;900&family=Archivo+Black&family=Bebas+Neue&family=Permanent+Marker&family=Ma+Shan+Zheng&family=Gowun+Batang:wght@700&family=Noto+Serif+SC:wght@700;900&family=Noto+Serif+JP:wght@700;900&family=Noto+Serif+KR:wght@700;900&family=Playfair+Display:wght@700&family=Nanum+Brush+Script&family=Zhi+Mang+Xing&family=Yusei+Magic&family=Caveat+Brush&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow: hidden; background: #000; }
  .t { position: relative; overflow: hidden; }
  .t.h { width: 1280px; height: 720px; }
  .t.v { width: 720px; height: 1280px; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .abs { position: absolute; }

  /* 본문(현재 언어) 굵은 글꼴 */
  .m { font-family: "Black Han Sans", "Noto Sans KR", sans-serif; font-weight: 400; }
  .zh .m { font-family: "Noto Sans SC", sans-serif; font-weight: 900; }
  .ja .m { font-family: "Noto Sans JP", sans-serif; font-weight: 900; }
  .en .m { font-family: "Archivo Black", sans-serif; }
  .sub { font-family: "Noto Sans KR", sans-serif; font-weight: 900; }
  .zh .sub { font-family: "Noto Sans SC", sans-serif; }
  .ja .sub { font-family: "Noto Sans JP", sans-serif; }

  /* 섞어 쓰는 언어 요소 */
  .x-zh { font-family: "Ma Shan Zheng", "Noto Sans SC", serif; font-weight: 400; }   /* 붓글씨 한자 */
  .x-en { font-family: "Bebas Neue", sans-serif; letter-spacing: .04em; }            /* 길쭉한 영문 */
  .x-mk { font-family: "Permanent Marker", cursive; }                                 /* 마커 영문 */
  .x-ko { font-family: "Do Hyeon", sans-serif; }                                      /* 네모난 한글 */
  .x-ja { font-family: "Noto Sans JP", sans-serif; font-weight: 900; }

  .stroke { -webkit-text-stroke: 12px #111; paint-order: stroke fill; }
  .nowrap { white-space: nowrap; }
  .boxline { display: inline-block; background: #fff; color: #111; padding: 4px 18px 8px; margin-bottom: 10px; box-shadow: 6px 6px 0 rgba(0,0,0,.35); }
  .tag { display: inline-block; padding: 6px 18px 8px; border-radius: 10px; }
  .wm { position: absolute; right: 26px; top: 24px; display: flex; align-items: center; gap: 8px; background: rgba(17,17,17,.7); color: #fff; border-radius: 10px; padding: 7px 12px 7px 9px; font-family: "Noto Sans KR", sans-serif; font-weight: 900; font-size: 22px; }
  .wm i { width: 28px; height: 20px; border-radius: 5px; background: #ff0033; display: grid; place-items: center; }
  .wm i::after { content: ""; border-left: 9px solid #fff; border-top: 6px solid transparent; border-bottom: 6px solid transparent; margin-left: 2px; }

  /* 카드뉴스 표지 */
  .cn-top { position: absolute; left: 0; right: 0; top: 0; height: 620px; overflow: hidden; }
  .cn-top img { width: 100%; height: 100%; object-fit: cover; }
  .cn-panel { position: absolute; left: 0; right: 0; bottom: 0; height: 660px; padding: 64px 52px 0; }
  .cn-label { display: inline-block; font-family: "Bebas Neue", sans-serif; font-size: 38px; letter-spacing: .12em; padding: 2px 14px 0; border-radius: 4px; }
  .cn-title { margin-top: 26px; font-size: 100px; line-height: 1.12; }
  .cn-title span { display: block; white-space: nowrap; }
  .cn-foot { position: absolute; left: 52px; right: 52px; bottom: 50px; display: flex; justify-content: space-between; align-items: center; font-family: "Bebas Neue", sans-serif; font-size: 36px; letter-spacing: .08em; }
  .cn-foot .dots { display: flex; gap: 10px; }
  .cn-foot .dots b { width: 14px; height: 14px; border-radius: 50%; background: currentColor; opacity: .35; }
  .cn-foot .dots b:first-child { width: 40px; border-radius: 7px; opacity: 1; }
  /* Q&A 창 상자 (자기소개) */
  .qbox { position: absolute; background: rgba(255,255,255,.94); border-radius: 10px; box-shadow: 0 6px 16px rgba(0,0,0,.18); padding: 26px 22px 12px; font-family: "Noto Sans KR", sans-serif; font-weight: 700; font-size: 36px; color: #222; white-space: nowrap; }
  .zh .qbox { font-family: "Noto Sans SC", sans-serif; }
  .ja .qbox { font-family: "Noto Sans JP", sans-serif; }
  .qbox::before { content: ""; position: absolute; left: 12px; top: 10px; width: 9px; height: 9px; border-radius: 50%; background: #ff5f57; box-shadow: 14px 0 0 #febc2e, 28px 0 0 #28c840; }
  .serif-out { color: #fff; -webkit-text-stroke: 3px #3a3a3a; paint-order: stroke fill; font-family: "Gowun Batang", "Noto Serif KR", serif; font-weight: 700; letter-spacing: .02em; text-shadow: 0 3px 10px rgba(0,0,0,.25); }
  .zh .serif-out { font-family: "Noto Serif SC", serif; }
  .ja .serif-out { font-family: "Noto Serif JP", serif; }
  .en .serif-out { font-family: "Playfair Display", serif; }

  /* 다큐 스타일 (문화 비교) */
  .doc-word { color: #fff; -webkit-text-stroke: 6px #111; paint-order: stroke fill; font-family: "Noto Serif KR", serif; font-weight: 900; }
  .doc-sub { font-family: "Noto Sans KR", sans-serif; font-weight: 900; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  .zh .doc-sub { font-family: "Noto Sans SC", sans-serif; }
  .ja .doc-sub { font-family: "Noto Sans JP", sans-serif; }

  /* 손글씨 브이로그 (상하이) */
  .hand { color: #fff; font-family: "Nanum Brush Script", cursive; text-shadow: 0 0 2px #2b2b2b, 0 0 4px #2b2b2b, 3px 4px 0 rgba(0,0,0,.55); line-height: 1.02; white-space: nowrap; }
  .zh .hand { font-family: "Zhi Mang Xing", "Ma Shan Zheng", cursive; }
  .ja .hand { font-family: "Yusei Magic", sans-serif; }
  .en .hand { font-family: "Caveat Brush", cursive; }

  /* 도우인 표지 */
  .dy-badge { position: absolute; left: 30px; top: 30px; display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,.55); color: #fff; border-radius: 8px; padding: 6px 14px; font-family: "Noto Sans SC", sans-serif; font-weight: 700; font-size: 30px; }
  .dy-title { position: absolute; left: 30px; right: 30px; text-align: center; color: #fff; font-family: "Black Han Sans", sans-serif; line-height: 1.12; -webkit-text-stroke: 10px #111; paint-order: stroke fill; filter: drop-shadow(0 4px 6px rgba(0,0,0,.4)); }
  .zh .dy-title { font-family: "Noto Sans SC", sans-serif; font-weight: 900; }
  .ja .dy-title { font-family: "Noto Sans JP", sans-serif; font-weight: 900; }
  .en .dy-title { font-family: "Archivo Black", sans-serif; }
  .dy-title span { display: block; white-space: nowrap; }
  .logo-plate { background: #fff; border-radius: 16px; display: grid; place-items: center; box-shadow: 0 8px 20px rgba(0,0,0,.3); }
  .cn-num { position: absolute; right: 36px; top: 34px; font-family: "Bebas Neue", sans-serif; font-size: 36px; letter-spacing: .06em; color: #fff; background: rgba(0,0,0,.55); border-radius: 999px; padding: 4px 18px 2px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const P = new URLSearchParams(location.search);
  const id = P.get("id") || "intro";
  const lang = P.get("lang") || "ko";
  document.body.className = lang;
  const T = (ko, zh, en, ja) => ({ ko, zh, en, ja })[lang];
  const SRC = "../images/thumbs/src/";
  const wm = () => `<div class="wm"><i></i>${T("김서연", "金谞延", "KIMSEOYEON", "キム・ソヨン")}</div>`;
  // 현재 언어가 아닌 '섞어 쓸' 언어: 한·중·영 중 나머지 (일본어 버전은 중·영)
  const others = lang === "ja" ? ["zh", "en"] : ["ko", "zh", "en"].filter(l => l !== lang);
  const has = l => others.includes(l);

  const designs = {
    /* 1. 채널 소개: 크림색 + 토마토 레드, 인사 스티커 */
    intro: () => `<div class="t h" style="background:#fff3df">
      <div class="abs" style="right:-80px;top:-60px;width:620px;height:840px;background:#ff5a3c;transform:rotate(8deg)"></div>
      <div class="abs" style="right:430px;top:-40px;width:40px;height:820px;background:#ffd23f;transform:rotate(8deg)"></div>
      <img src="${SRC}me.png" style="position:absolute;right:70px;bottom:0;height:680px;filter:drop-shadow(6px 0 0 #fff) drop-shadow(-6px 0 0 #fff) drop-shadow(0 -6px 0 #fff)">
      <div class="abs m nowrap" data-fit="700" style="left:60px;top:120px;font-size:116px;color:#1d1d1d;line-height:1.05">${T("안녕하세요,", "大家好，", "Hi there,", "はじめまして、")}</div>
      <div class="abs m nowrap" data-fit="700" style="left:60px;top:250px;font-size:126px;color:#ff5a3c;line-height:1.05">${T("김서연입니다", "我是金谞延", "I'm KIMSEOYEON", "キム・ソヨンです")}</div>
      <div class="abs" style="left:60px;top:440px;display:flex;gap:18px;align-items:center">
        ${has("zh") ? `<span class="tag x-zh" style="background:#d7263d;color:#fff;font-size:64px;transform:rotate(-5deg)">你好</span>` : ""}
        ${has("en") ? `<span class="tag x-mk" style="background:#1b998b;color:#fff;font-size:54px;transform:rotate(4deg)">Hello!</span>` : ""}
        ${has("ko") ? `<span class="tag x-ko" style="background:#2e4057;color:#fff;font-size:58px;transform:rotate(-3deg)">안녕하세요</span>` : ""}
        ${lang === "ja" ? `<span class="tag x-ko" style="background:#2e4057;color:#fff;font-size:58px;transform:rotate(-3deg)">안녕하세요</span>` : ""}
      </div>
      <div class="abs x-en" style="left:64px;bottom:44px;font-size:40px;color:#1d1d1d">SEOUL · SHENYANG · SHANGHAI</div>
    </div>`,

    /* 2. 심양: 차가운 겨울 호수 + 흰 박스 글씨 + 붉은 인장 */
    shenyang: () => `<div class="t h">
      <img class="bg" src="${SRC}sau.jpg" style="object-position:30% 50%;filter:saturate(.85) contrast(1.08) brightness(1.05)">
      <div class="abs" style="inset:0;background:linear-gradient(90deg,rgba(10,20,40,.55),rgba(10,20,40,0) 70%)"></div>
      ${wm()}
      ${has("en") ? `<div class="abs x-en" style="left:60px;top:58px;font-size:48px;color:#fff">EXCHANGE STUDENT · 2023</div>` : ""}
      ${lang === "en" ? `<div class="abs x-ko" style="left:60px;top:58px;font-size:44px;color:#fff">교환학생 · 2023</div>` : ""}
      <div class="abs" style="left:56px;bottom:56px">
        <div class="m boxline nowrap" data-fit="820" style="font-size:84px">${T("심양에서 한국인은", "在沈阳，韩国人", "In Shenyang, the only Korean", "瀋陽で韓国人は")}</div><br>
        <div class="m boxline nowrap" data-fit="820" style="font-size:96px;background:#e63946;color:#fff">${T("나 혼자였다", "只有我一个", "was me", "私ひとりだった")}</div>
      </div>
      <div class="abs x-zh" style="right:70px;bottom:60px;width:190px;height:400px;background:#c1121f;color:#fff;font-size:150px;line-height:1.25;text-align:center;border-radius:10px;padding-top:14px;box-shadow:8px 8px 0 rgba(0,0,0,.35)">沈<br>阳</div>
    </div>`,

    /* 3. 상하이: 노랑·검정 테이프 + 마커 영문 */
    shanghai: () => `<div class="t h">
      <img class="bg" src="${SRC}donghua.jpg" style="object-position:50% 62%;filter:saturate(1.15) contrast(1.05)">
      <div class="abs" style="inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.75))"></div>
      ${wm()}
      <div class="abs x-zh" style="left:50px;top:30px;font-size:150px;color:#fff;text-shadow:0 6px 16px rgba(0,0,0,.6)">上海</div>
      ${has("en") ? `<div class="abs x-mk" style="left:400px;top:96px;font-size:56px;color:#ffd23f;transform:rotate(-6deg);text-shadow:0 3px 8px rgba(0,0,0,.6)">1st place ×2!</div>` : ""}
      ${lang === "en" ? `<div class="abs x-ko" style="left:400px;top:96px;font-size:56px;color:#ffd23f;transform:rotate(-6deg);text-shadow:0 3px 8px rgba(0,0,0,.6)">반 1등 두 번!</div>` : ""}
      <div class="abs" style="left:50px;bottom:50px">
        <div class="m stroke nowrap" data-fit="1000" style="font-size:96px;color:#fff;line-height:1.1">${T("동화대학교 어학연수", "东华大学语言研修", "Language program in Shanghai", "東華大学で語学研修")}</div>
        <div class="m nowrap" data-fit="1000" style="display:inline-block;margin-top:14px;font-size:96px;background:#ffd23f;color:#111;padding:2px 22px 10px;transform:rotate(-1.5deg);box-shadow:8px 8px 0 #111">${T("2학기 연속 반 1등", "连续两学期班级第一", "Top of the class, twice", "2学期連続クラス1位")}</div>
      </div>
    </div>`,

    /* 4. 추석 vs 중추절: 한글·한자·영문이 한 화면에 */
    chuseok: () => `<div class="t h" style="background:#111">
      <img src="${SRC}songpyeon.jpg" style="position:absolute;left:0;top:0;width:640px;height:720px;object-fit:cover;filter:saturate(1.1)">
      <img src="${SRC}mooncake.jpg" style="position:absolute;right:0;top:0;width:640px;height:720px;object-fit:cover;object-position:40% 50%">
      <div class="abs" style="left:0;top:0;width:640px;height:720px;background:linear-gradient(180deg,rgba(20,90,60,.15),rgba(20,70,50,.7))"></div>
      <div class="abs" style="right:0;top:0;width:640px;height:720px;background:linear-gradient(180deg,rgba(150,40,20,.1),rgba(120,30,10,.72))"></div>
      ${wm()}
      <div class="abs x-ko stroke" style="left:0;width:640px;bottom:150px;text-align:center;font-size:170px;color:#fff;-webkit-text-stroke-width:10px">추석</div>
      <div class="abs x-zh" style="right:0;width:640px;bottom:140px;text-align:center;font-size:180px;color:#ffd23f;text-shadow:0 6px 18px rgba(0,0,0,.6)">中秋节</div>
      <div class="abs x-en" style="left:575px;top:250px;width:130px;height:130px;border-radius:50%;background:#fff;color:#d7263d;font-size:84px;display:grid;place-items:center;box-shadow:0 0 0 8px #111">VS</div>
      <div class="abs sub nowrap" data-fit="1100" style="left:50%;transform:translateX(-50%);bottom:52px;font-size:46px;color:#fff;background:rgba(0,0,0,.55);padding:6px 24px;border-radius:999px">${T("같은 보름달, 다른 명절", "同一轮满月，不同的节日", "Same full moon, two holidays", "同じ満月、違う祝日")}</div>
    </div>`,

    /* 5. 오리온: 빨강·노랑, 가격표 */
    orion: () => `<div class="t h" style="background:#e10600">
      <img src="${SRC}chocopie.jpg" style="position:absolute;right:0;top:0;width:760px;height:720px;object-fit:cover;object-position:60% 50%">
      <div class="abs" style="left:0;top:0;width:620px;height:720px;background:#e10600;clip-path:polygon(0 0,100% 0,85% 100%,0 100%)"></div>
      ${wm()}
      ${has("zh") ? `<div class="abs x-zh" style="left:56px;top:46px;font-size:92px;color:#ffd23f">好丽友</div>` : ""}
      ${lang === "zh" ? `<div class="abs x-ko" style="left:56px;top:60px;font-size:80px;color:#ffd23f">오리온</div>` : ""}
      <div class="abs m nowrap" data-fit="600" style="left:56px;top:200px;font-size:92px;color:#fff;line-height:1.15">${T("초코파이 가격,", "好丽友派的价格", "Choco Pie prices", "チョコパイの値段")}</div>
      <div class="abs m nowrap" data-fit="600" style="left:56px;top:315px;font-size:92px;color:#ffd23f;line-height:1.15">${T("나라마다 왜 달라?", "为什么各国不同？", "— why so different?", "国ごとになぜ違う？")}</div>
      <div class="abs" style="left:56px;bottom:56px;display:flex;gap:14px">
        ${[["₩","KR"],["¥","CN"],["₽","RU"],["₫","VN"]].map(([c, n], i) => `<span style="display:inline-flex;flex-direction:column;align-items:center;background:#fff;color:#111;border-radius:10px;padding:6px 16px 4px;transform:rotate(${[-4,3,-2,4][i]}deg);box-shadow:5px 5px 0 rgba(0,0,0,.3)"><b style="font-family:Archivo Black;font-size:46px;color:#e10600;line-height:1">${c}</b><i class="x-en" style="font-style:normal;font-size:28px">${n}</i></span>`).join("")}
      </div>
      ${has("en") ? `<div class="abs x-mk" style="right:40px;bottom:40px;font-size:52px;color:#fff;transform:rotate(-6deg);text-shadow:0 3px 8px rgba(0,0,0,.6)">price check!</div>` : ""}
    </div>`,

    /* ---------- Shorts 카드뉴스 표지 (색 다르게) ---------- */
    "s-wok": () => cover({ img: "menu.jpg", crop: "width:1600px;height:auto;margin-left:-40px;margin-top:-660px", panel: "#ff6b4a", ink: "#fff", label: "#1d1d1d", labelInk: "#fff",
      l1: T("중국어 통역", "中韩口译", "Chinese ↔ Korean", "中国語の通訳"), l2: T("알바 이야기", "兼职经历", "at work", "バイトの話"), hi: "#1d1d1d",
      zh: "翻译", en: "PART-TIME" }),
    "s-notes": () => cover({ html: notebook(), panel: "#ffc93c", ink: "#1d1d1d", label: "#1d1d1d", labelInk: "#ffc93c",
      l1: T("직역 말고", "不要直译", "Not word for word,", "直訳じゃなくて"), l2: T("의역으로", "要意译", "but meaning", "意訳で"), hi: "#d7263d",
      zh: "意译", en: "TRANSLATION" }),
    "s-trophy": () => cover({ html: medal(), panel: "#6c4bd8", ink: "#fff", label: "#ffd23f", labelInk: "#1d1d1d",
      l1: T("팀으로 받은", "团队一起拿下", "Won together:", "チームでとった"), l2: T("우수상", "优秀奖", "Excellence Award", "優秀賞"), hi: "#ffd23f",
      zh: "优秀奖", en: "AWARD" }),
    "s-katsu": () => cover({ img: "tonkatsu.jpg", pos: "50% 55%", panel: "#1f9e74", ink: "#fff", label: "#fff", labelInk: "#1f9e74",
      l1: T("1년 6개월", "一年半", "1.5 years", "1年半"), l2: T("홀 담당", "负责大厅", "on the floor", "ホール担当"), hi: "#ffe14d",
      zh: "一年半", en: "SERVER" }),
    "s-latte": () => cover({ img: "cafe.jpg", pos: "48% 58%", panel: "#ff7aa8", ink: "#1d1d1d", label: "#1d1d1d", labelInk: "#ff7aa8",
      l1: T("카페 3곳,", "三家咖啡店", "3 cafés,", "カフェ3店舗、"), l2: T("한 달 만에 혼자", "一个月就能独当一面", "solo in a month", "1か月でひとり立ち"), hi: "#fff",
      zh: "咖啡", en: "BARISTA" })
  };

  function notebook() {
    return `<div style="position:absolute;inset:0;background:#fffdf5;background-image:repeating-linear-gradient(180deg,transparent 0 58px,#cfe0f5 58px 60px);">
      <div style="position:absolute;left:90px;top:0;bottom:0;width:3px;background:#f2a3a3"></div>
      <div class="x-zh" style="position:absolute;left:130px;top:120px;font-size:84px;color:#1d1d1d">直译 <span style="color:#d7263d">✗</span></div>
      <div class="x-zh" style="position:absolute;left:130px;top:250px;font-size:84px;color:#1d1d1d">意译 <span style="color:#1f9e74">✓</span></div>
      <div class="x-ko" style="position:absolute;left:400px;top:150px;font-size:52px;color:#5a6a8e;transform:rotate(-4deg)">→ 의미를 옮기기</div>
      <div class="x-mk" style="position:absolute;left:130px;top:410px;font-size:48px;color:#2e4057;transform:rotate(-3deg)">meaning &gt; words</div>
    </div>`;
  }
  function medal() {
    return `<div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#8f74ff 0%,#4b2fb0 70%)">

      "#2b1a12", T("중국어 통역", "中韩口译", "Chinese–Korean", "中国語通訳"), T("아르바이트", "兼职", "interpreting job", "アルバイト"), T("백화점 매장 · 홀서빙", "百货商场店 · 服务员", "Dept. store · Server", "百貨店・ホール担当")),

    "s-katsu": () => simple(`<div style="position:absolute;inset:0;background:#fffaf2;display:grid;place-items:center">
          <div style="text-align:center"><img src="${SRC}logo_misoya.png" style="width:520px">
          <div style="margin-top:40px;display:inline-block;background:#1d3fa8;color:#fff;font:900 52px ${SANS};padding:10px 30px;border-radius:999px">${T("1년 6개월", "一年半", "1.5 years", "1年半")}</div></div></div>`,
      "#1d3fa8", T("미소야", "Misoya", "Misoya", "ミソヤ"), T("홀 전담", "独自负责大厅", "running the floor", "ホール担当"), T("고객응대 · 신입 교육", "顾客接待 · 新人培训", "Service · Training new staff", "接客・新人教育")),

    "s-trophy": () => simple(`<div style="position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#fff7d6 0%,#d9f2d4 70%)">
          <div style="position:absolute;left:70px;right:70px;top:110px;height:460px">${turtle}</div>
          <div style="position:absolute;left:0;right:0;top:590px;text-align:center;font:900 40px ${SANS};color:#2f8a50">${T("경기대학교", "京畿大学", "Kyonggi University", "京畿大学")}</div></div>`,
      "#6c4bd8", T("거북이 프로그램", "乌龟项目", "Turtle Program", "カメプログラム"), T("우수상", "优秀奖", "Excellence Award", "優秀賞"), T("팀 활동 2회 참여", "团队活动2次", "2 team rounds", "チーム活動2回")),

    "s-latte": () => simple(`<div style="position:absolute;inset:0;background:#141414">
          <div style="position:absolute;left:0;top:70px;width:720px;height:235px;background:url('${SRC}cafes.png') -397px -96px / 1117px 633px no-repeat"></div>
          <div style="position:absolute;left:0;top:305px;width:720px;height:4px;background:#e85d8f"></div>
          <div style="position:absolute;left:90px;right:90px;top:380px;height:130px;background:#fff;border-radius:18px;display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.35)"><img src="${SRC}logo_ediya.png" style="width:84%"></div>
          <div style="position:absolute;left:0;right:0;top:560px;text-align:center;font:900 40px ${SANS};color:#fff">MEGA · COMPOSE · EDIYA</div></div>`,
      "#e85d8f", T("카페 알바", "咖啡店兼职", "Café jobs", "カフェバイト"), T("3곳", "三家", "× 3", "3店舗"), T("메가커피 · 이디야 · 컴포즈", "Mega · Ediya · Compose", "Mega · Ediya · Compose", "Mega・Ediya・Compose"))
  });

  /* 스킬 소개 영상 썸네일 (흰 배경) */
  const SK = {
    claude: `<svg viewBox="0 0 24 24"><g stroke="#D97757" stroke-width="2.4" stroke-linecap="round">${[0,30,60,90,120,150,180,210,240,270,300,330].map((r, i) => `<line x1="12" y1="12" x2="12" y2="${[2.2,3.6,2.6,3.2,2.4,3.8][i % 6]}" transform="rotate(${r} 12 12)"/>`).join("")}</g></svg>`,
    ppt: `<svg viewBox="0 0 24 24"><circle cx="14" cy="12" r="9" fill="#ED6C47"/><path d="M14 3a9 9 0 0 1 9 9h-9z" fill="#FF8F6B"/><path d="M14 12h9a9 9 0 0 1-9 9z" fill="#D35230"/><rect x="1.5" y="6" width="12" height="12" rx="2" fill="#C43E1C"/><path d="M5.2 15.6V8.4h3.1c1.7 0 2.7.9 2.7 2.3s-1 2.4-2.7 2.4H6.9v2.5zm1.7-3.9h1.2c.8 0 1.2-.4 1.2-1s-.4-1-1.2-1H6.9z" fill="#fff"/></svg>`,
    word: `<svg viewBox="0 0 24 24"><rect x="7" y="3" width="15" height="18" rx="2" fill="#41A5EE"/><rect x="7" y="9" width="15" height="6" fill="#2B7CD3"/><path d="M7 15h15v4a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2z" fill="#185ABD"/><rect x="1.5" y="6" width="12" height="12" rx="2" fill="#185ABD"/><path d="M3.6 8.6h1.6l1 4.6 1.1-4.6h1.4l1.1 4.6 1-4.6h1.6l-1.8 6.8H8.2L7.5 10.7l-1.1 4.7H5.4z" fill="#fff"/></svg>`
  };
  designs.skills = () => {
    const items = [[SK.claude, "Claude"], [SK.ppt, "PowerPoint"], [SK.word, "Word"], [flagSvg("cn"), T("중국어", "中文", "Chinese", "中国語")], [flagSvg("jp"), T("일본어", "日语", "Japanese", "日本語")]];
    return `<div class="t h" style="background:#ffffff">
      <div class="abs" style="left:0;right:0;top:0;height:14px;background:linear-gradient(90deg,#D97757,#ED6C47,#2B7CD3,#EE1C25,#BC002D)"></div>
      ${wm()}
      <div class="abs nowrap" data-fit="1180" style="left:60px;top:90px;font:900 96px ${SANS};color:#111">${T("제가 할 줄 아는 것", "我会的技能", "What I can do", "わたしのスキル")}</div>
      <div class="abs nowrap" style="left:64px;top:210px;font:700 40px ${SANS};color:#777">${T("AI · 문서 · 발표 · 언어", "AI · 文档 · 演示 · 语言", "AI · Docs · Slides · Languages", "AI・文書・発表・言語")}</div>
      <div class="abs" style="left:60px;right:60px;top:330px;display:flex;justify-content:space-between">
        ${items.map(([ic, n]) => `<div style="width:200px;text-align:center">
          <div style="width:170px;height:170px;margin:0 auto;border-radius:50%;background:#fff;border:3px solid #e6e8ee;box-shadow:0 10px 24px rgba(0,0,0,.08);display:grid;place-items:center;overflow:hidden">
            <div style="width:${ic.startsWith('<svg viewBox="0 0 30') ? "100%" : "62%"};height:${ic.startsWith('<svg viewBox="0 0 30') ? "100%" : "62%"};display:grid">${ic.replace("<svg ", '<svg preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%" ')}</div></div>
          <div style="font:900 34px ${SANS};color:#222;margin-top:18px">${n}</div></div>`).join("")}
      </div>
    </div>`;
  };

  function explainer(head, rows, msg, btn) {
    return `<div class="t v" style="background:linear-gradient(160deg,#f7f8fa 0%,#e9ecf1 100%)">
      <div class="abs" style="right:-120px;bottom:-60px;width:620px;height:760px;background:radial-gradient(60% 50% at 50% 40%,#3a4250,#1b1f27 70%);border-radius:50% 50% 0 0;opacity:.85"></div>
      <div class="abs" style="left:40px;right:40px;top:110px;text-align:center;font:900 58px ${SANS};line-height:1.35;color:#111">
        <div><span class="nowrap" data-fit="640" style="display:inline-block;background:#2f6bff;color:#fff;padding:0 14px">${head[0]}</span></div>
        <div class="nowrap" data-fit="640" style="color:#2f6bff;display:inline-block">${head[1]}</div>
      </div>
      <div class="abs" style="left:90px;right:90px;top:400px;background:#fff;border:2px solid #b9c0cc;box-shadow:0 12px 30px rgba(0,0,0,.18)">
        <div style="height:30px;background:#eef1f5;border-bottom:2px solid #b9c0cc;text-align:right;padding-right:10px;font:700 16px monospace;color:#6b7280;line-height:28px">_ □ ×</div>
        <div style="padding:22px">
          ${rows.map(([k, v]) => `<div style="display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-bottom:10px"><div style="border:2px solid #cfd5de;padding:10px;font:900 30px ${SANS};text-align:center">${k}</div><div style="border:2px solid #cfd5de;padding:10px;font:700 30px ${SANS};text-align:center">${v}</div></div>`).join("")}
          <div style="border:2px solid #cfd5de;padding:18px 10px;text-align:center;font:700 30px ${SANS};line-height:1.5"><b style="font-weight:900">${msg[0]}</b><br>${msg[1]}<br><span style="color:#2f6bff;font-weight:900;text-decoration:underline">${msg[2]}</span></div>
          <div style="text-align:center;margin-top:16px;position:relative"><span style="display:inline-block;background:#9aa1ad;color:#fff;font:900 30px ${SANS};padding:8px 26px;border-radius:6px">${btn}</span>
            <svg style="position:absolute;left:80%;top:30px" width="56" height="70" viewBox="0 0 24 30"><path d="M2 2l18 14-8 1 5 9-4 2-5-9-6 6z" fill="#fff" stroke="#111" stroke-width="1.6"/></svg></div>
        </div>
      </div>
      <div class="dy-badge" style="background:rgba(0,0,0,.7)">▣ 图文</div>
    </div>`;
  }

  function dyCover(bgHtml, l1, l2, hi, chip, chipBg) {
    return `<div class="t v" style="background:#111">${bgHtml}
      <div class="abs" style="inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0) 38%,rgba(0,0,0,0) 65%,rgba(0,0,0,.5))"></div>
      <div class="dy-badge">▣ 图文</div>
      <div class="dy-title" style="top:150px;font-size:92px"><span data-fit="660">${l1}</span><span data-fit="660" style="color:${hi}">${l2}</span></div>
      <div class="abs sub nowrap" data-fit="640" style="left:50%;transform:translateX(-50%) rotate(-2deg);bottom:120px;font-size:46px;color:#fff;background:${chipBg};padding:8px 26px;border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.35)">${chip}</div>
    </div>`;
  }

  document.getElementById("root").innerHTML = designs[id]();

  document.fonts.ready.then(() => {
    document.querySelectorAll("[data-fit]").forEach(el => {
      const max = Number(el.dataset.fit);
      const prev = el.style.display;
      if (!prev || prev === "block") el.style.display = "inline-block";
      let size = parseFloat(getComputedStyle(el).fontSize);
      while (el.getBoundingClientRect().width > max && size > 16) { size -= 2; el.style.fontSize = size + "px"; }
      el.style.display = prev;
    });
  });
</script>
</body>
