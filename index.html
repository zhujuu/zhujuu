<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김서연 | KIMSEOYEON - 金谞延</title>
  <meta name="description" content="김서연(KIMSEOYEON · 金谞延) 포트폴리오 — 한국과 세계를 잇는 사람">
  <link rel="canonical" href="https://zhujuu.github.io/zhujuu/">

  <!-- 한글 / 중국어 간체 / 일본어 / 영문 웹폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --navy: #0b1f4b;
      --navy-2: #16306a;
      --soft: #5a6a8e;
      --line: #e3e7f0;
      --tint: #f3f5fa;
      --grey: #dde2ec;
      --radius: 20px;
      --font-ko: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
      --font-zh: "Noto Sans SC", "Microsoft YaHei", "微软雅黑", "PingFang SC", "SimSun", sans-serif;
      --font-ja: "Noto Sans JP", "Yu Gothic", "游ゴシック", "Hiragino Sans", "Meiryo", sans-serif;
      --font-en: "Poppins", var(--font-ko);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; scroll-padding-top: 76px; }

    body {
      background: var(--bg);
      color: var(--navy);
      font-family: var(--font-ko);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      word-break: keep-all;
    }

    /* 선택한 언어에 맞는 글꼴 — 한자·가나가 깨지지 않도록 */
    html:lang(zh) body { font-family: var(--font-zh); }
    html:lang(ja) body { font-family: var(--font-ja); }
    .zh, [lang="zh-Hans"] { font-family: var(--font-zh); }
    .latin { font-family: var(--font-en); }

    a { color: inherit; }
    .container { max-width: 1080px; margin: 0 auto; padding: 0 24px; }

    /* ---------- 상단 바 + 언어 버튼 ---------- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }
    .topbar .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      height: 64px;
    }
    .logo {
      font-family: var(--font-en);
      font-weight: 700;
      font-size: 18px;
      text-decoration: none;
      white-space: nowrap;
    }
    .nav-links { display: flex; gap: 24px; font-size: 14px; font-weight: 500; }
    .nav-links a { text-decoration: none; color: var(--soft); }
    .nav-links a:hover { color: var(--navy); }

    .lang-switch {
      display: flex;
      gap: 4px;
      padding: 4px;
      background: var(--tint);
      border-radius: 999px;
    }
    .lang-switch button {
      border: 0;
      background: transparent;
      color: var(--soft);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: background .2s, color .2s;
    }
    .lang-switch button[data-lang="ko"] { font-family: var(--font-ko); }
    .lang-switch button[data-lang="zh"] { font-family: var(--font-zh); }
    .lang-switch button[data-lang="en"] { font-family: var(--font-en); }
    .lang-switch button[data-lang="ja"] { font-family: var(--font-ja); }
    .lang-switch button:hover { color: var(--navy); }
    .lang-switch button[aria-pressed="true"] {
      background: var(--navy);
      color: #fff;
    }

    /* ---------- 히어로 ---------- */
    .hero {
      background: var(--navy);
      color: #fff;
      padding: 72px 0 120px;
      overflow: hidden;
    }
    .hero .container {
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 48px;
      align-items: center;
    }
    .eyebrow {
      font-family: var(--font-en);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.24em;
      color: #9fb3dd;
      margin-bottom: 16px;
    }
    .hero h1 {
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 500;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }
    .hero h1 strong { font-weight: 900; }
    .hero .desc {
      margin-top: 24px;
      font-size: 16px;
      color: #d4dcef;
      max-width: 560px;
    }
    .hero .desc strong { color: #fff; font-weight: 700; }
    .hero .buttons { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: transform .2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-light { background: #fff; color: var(--navy); }
    .btn-outline { border: 1.5px solid rgba(255,255,255,.6); color: #fff; }

    .photo-card {
      justify-self: center;
      width: 100%;
      max-width: 280px;
      background: #fff;
      padding: 10px;
      border-radius: 24px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.3);
    }
    .photo-card img {
      display: block;
      width: 100%;
      aspect-ratio: 266 / 348;
      object-fit: cover;
      border-radius: 16px;
    }

    /* ---------- 숫자 카드 (사진1 프로필 통계) ---------- */
    .stats {
      position: relative;
      margin-top: -64px;
      z-index: 2;
    }
    .stats-card {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 12px 32px rgba(11, 31, 75, 0.12);
      padding: 28px 12px;
      text-align: center;
    }
    .stats-card div + div { border-left: 1px solid var(--line); }
    .stats-card b {
      display: block;
      font-family: var(--font-en);
      font-size: 30px;
      font-weight: 700;
      line-height: 1.2;
    }
    .stats-card span { font-size: 13px; color: var(--soft); }

    /* ---------- 섹션 공통 ---------- */
    section.block { padding: 88px 0 0; }
    .section-title {
      font-family: var(--font-en);
      font-size: clamp(28px, 4vw, 36px);
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.02em;
    }
    .section-sub {
      text-align: center;
      color: var(--soft);
      font-size: 14px;
      margin-top: 4px;
    }
    .sub-title {
      font-size: 22px;
      font-weight: 700;
      padding-bottom: 12px;
      margin-bottom: 28px;
      border-bottom: 2px solid var(--navy);
      display: inline-block;
    }

    /* ---------- ABOUT ME 표 (사진2) ---------- */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 40px;
      align-items: start;
    }
    .info-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--line);
    }
    .info-table th, .info-table td {
      padding: 16px 20px;
      text-align: left;
      font-size: 15px;
      vertical-align: middle;
    }
    .info-table tr + tr th, .info-table tr + tr td { border-top: 1px solid var(--line); }
    .info-table th {
      width: 34%;
      background: var(--navy);
      color: #fff;
      font-weight: 500;
      font-size: 14px;
    }
    .info-table tr + tr th { border-top-color: rgba(255,255,255,.12); }
    .info-table td { font-weight: 500; overflow-wrap: anywhere; }
    .info-table td a { text-decoration: none; border-bottom: 1px solid var(--grey); }

    /* 스킬 원형 칩 (사진1 카테고리) */
    .skills-card {
      background: var(--tint);
      border-radius: var(--radius);
      padding: 28px 24px;
    }
    .skills-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 20px; }
    .chips { display: flex; flex-wrap: wrap; gap: 20px; }
    .chip { text-align: center; width: 84px; }
    .chip .circle {
      width: 72px;
      height: 72px;
      margin: 0 auto 8px;
      border-radius: 50%;
      background: #fff;
      border: 6px solid var(--grey);
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 700;
    }
    .chip.primary .circle { background: var(--navy); border-color: #c9d3ea; color: #fff; }
    .chip .name { font-size: 14px; font-weight: 700; display: block; }
    .chip .note { font-size: 12px; color: var(--soft); display: block; line-height: 1.4; }

    /* ---------- 경험 카드 (사진1 추천 메뉴 카드) ---------- */
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 40px;
    }
    .card {
      border: 1.5px solid var(--navy);
      border-radius: var(--radius);
      overflow: hidden;
      background: #fff;
    }
    .card .thumb {
      height: 150px;
      background: var(--grey);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 20px 24px;
    }
    .card .thumb .city {
      font-size: 44px;
      font-weight: 900;
      line-height: 1;
      color: var(--navy-2);
    }
    .card .thumb .year {
      font-family: var(--font-en);
      font-weight: 600;
      font-size: 14px;
      background: #fff;
      border-radius: 999px;
      padding: 4px 12px;
    }
    .card .body { padding: 20px 24px 24px; }
    .card .body h4 { font-size: 18px; font-weight: 700; }
    .card .body p { font-size: 14px; color: var(--soft); font-family: var(--font-en); }

    /* ---------- 학력 · 자격증 타임라인 (사진2) ---------- */
    .timeline-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
    }
    .timeline { list-style: none; position: relative; }
    .timeline li {
      position: relative;
      padding-left: 56px;
      padding-bottom: 28px;
    }
    .timeline li::before {
      content: "";
      position: absolute;
      left: 15px;
      top: 32px;
      bottom: 0;
      width: 2px;
      background: var(--line);
    }
    .timeline li:last-child::before { display: none; }
    .timeline .check {
      position: absolute;
      left: 0;
      top: 2px;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--navy);
      display: grid;
      place-items: center;
    }
    .timeline h4 { font-size: 18px; font-weight: 700; line-height: 1.5; }
    .timeline h4 .tag {
      font-size: 12px;
      font-weight: 500;
      background: var(--tint);
      border-radius: 999px;
      padding: 2px 10px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .timeline p { font-size: 14px; color: var(--soft); }
    .timeline .when { font-family: var(--font-en); font-size: 13px; font-weight: 600; color: var(--navy); }

    /* ---------- 푸터 ---------- */
    footer {
      margin-top: 96px;
      padding: 32px 0;
      border-top: 1px solid var(--line);
      font-size: 13px;
      color: var(--soft);
      text-align: center;
    }

    /* ---------- 모바일 하단 탭 (사진1) ---------- */
    .tabbar { display: none; }

    @media (max-width: 860px) {
      .nav-links { display: none; }
      .hero { padding: 48px 0 104px; }
      .hero .container { grid-template-columns: 1fr; gap: 32px; }
      .photo-card { order: -1; max-width: 200px; justify-self: start; }
      .about-grid, .timeline-grid { grid-template-columns: 1fr; }
      .cards {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        gap: 16px;
        padding-bottom: 8px;
        margin-right: -16px;
        padding-right: 16px;
      }
      .card { flex: 0 0 82%; scroll-snap-align: start; }
    }

    @media (max-width: 600px) {
      .container { padding: 0 16px; }
      .topbar .container { height: auto; padding-top: 10px; padding-bottom: 10px; flex-wrap: wrap; }
      .logo { font-size: 16px; }
      .lang-switch { width: 100%; justify-content: space-between; }
      .lang-switch button { flex: 1; padding: 6px 4px; }
      html { scroll-padding-top: 108px; }
      .stats-card b { font-size: 24px; }
      .stats-card span { font-size: 12px; }
      .info-table th, .info-table td { padding: 14px 14px; }
      .card .thumb .city { font-size: 36px; }
      section.block { padding-top: 64px; }

      body { padding-bottom: 72px; }
      .tabbar {
        display: flex;
        position: fixed;
        left: 0; right: 0; bottom: 0;
        z-index: 20;
        background: #fff;
        border-top: 1px solid var(--line);
        border-radius: 20px 20px 0 0;
        box-shadow: 0 -6px 20px rgba(11, 31, 75, 0.06);
        padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      }
      .tabbar a {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        font-size: 11px;
        color: var(--soft);
        text-decoration: none;
      }
      .tabbar svg { width: 22px; height: 22px; }
      footer { margin-top: 64px; }
    }
  </style>
</head>
<body>

  <!-- 상단: 이름 + 메뉴 + 언어 버튼 -->
  <header class="topbar">
    <div class="container">
      <a class="logo" href="#top">Kim Seoyeon</a>
      <nav class="nav-links" aria-label="Sections">
        <a href="#about" data-i18n="nav.about"></a>
        <a href="#experience" data-i18n="nav.exp"></a>
        <a href="#education" data-i18n="nav.edu"></a>
      </nav>
      <div class="lang-switch" role="group" aria-label="Language">

        <button type="button" data-lang="zh" lang="zh-Hans">中文</button>
        <button type="button" data-lang="en" lang="en">English</button>
        <button type="button" data-lang="ja" lang="ja">日本語</button>

  <main id="top">
    <!-- 히어로 -->
    <section class="hero">
      <div class="container">
        <div>
          <p class="eyebrow">PORTFOLIO</p>
          <h1><span data-i18n="hero.hello"></span><br><span data-i18n="hero.title"></span></h1>
          <p class="desc" data-i18n="hero.desc"></p>
          <div class="buttons">
            <a class="btn btn-light" href="mailto:rlatjdus129@naver.com" data-i18n="btn.contact"></a>
            <a class="btn btn-outline" href="#about" data-i18n="btn.more"></a>
          </div>
        </div>
        <div class="photo-card">
          <img src="images/profile.png" alt="김서연 KIMSEOYEON 金谞延">
        </div>
      </div>
    </section>

    <!-- 숫자 요약 -->
    <div class="stats">
      <div class="container">
        <div class="stats-card">
          <div><b>2</b><span data-i18n="stat.majors"></span></div>
          <div><b>2</b><span data-i18n="stat.cities"></span></div>
          <div><b>1</b><span data-i18n="stat.cert"></span></div>
        </div>
      </div>
    </div>

    <!-- ABOUT ME -->
    <section class="block" id="about">
      <div class="container">
        <h2 class="section-title">ABOUT ME</h2>
        <p class="section-sub" data-i18n="about.sub"></p>

        <div class="about-grid">
          <table class="info-table">
            <tr>
              <th data-i18n="info.name"></th>

            </tr>
            <tr>
              <th data-i18n="info.birth"></th>
              <td class="latin">2003.12.09</td>
            </tr>
            <tr>
              <th data-i18n="info.email"></th>
              <td><a class="latin" href="mailto:rlatjdus129@naver.com">rlatjdus129@naver.com</a></td>
            </tr>
          </table>

          <div class="skills-card" id="skills">
            <h3 data-i18n="skills.title"></h3>
            <div class="chips">
              <div class="chip primary">
                <div class="circle" aria-hidden="true">✳</div>
                <span class="name latin">Claude</span>
                <span class="note" data-i18n="skills.ai"></span>
              </div>
              <div class="chip">
                <div class="circle" lang="zh-Hans" aria-hidden="true">中</div>
                <span class="name" data-i18n="skills.zh"></span>
              </div>
              <div class="chip">
                <div class="circle" lang="ja" style="font-family: var(--font-ja);" aria-hidden="true">あ</div>
                <span class="name" data-i18n="skills.ja"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 경험 -->
    <section class="block" id="experience">
      <div class="container">
        <h2 class="section-title">EXPERIENCE</h2>
        <p class="section-sub" data-i18n="exp.sub"></p>
        <div class="cards">
          <article class="card">
            <div class="thumb">
              <span class="city" data-i18n="exp1.city"></span>
              <span class="year">2023</span>
            </div>
            <div class="body">
              <h4 data-i18n="exp1.title"></h4>

          <article class="card">
            <div class="thumb">
              <span class="city" data-i18n="exp2.city"></span>

            </div>
            <div class="body">
              <h4 data-i18n="exp2.title"></h4>
              <p>2025.09 – 2026.06</p>
            </div>
          </article>
        </div>
      </div>
    </section>

    <!-- 학력 · 자격증 -->
    <section class="block" id="education">
      <div class="container">
        <div class="timeline-grid">
          <div>
            <h3 class="sub-title" data-i18n="edu.title"></h3>
            <ul class="timeline">
              <li>
                <span class="check" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span>
                <h4><span data-i18n="edu.school"></span><span class="tag" data-i18n="edu.status"></span></h4>

              <li>

                <h4 class="latin">JLPT N3</h4>

          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container" data-i18n="footer"></div>
  </footer>

  <!-- 모바일 하단 탭 -->
  <nav class="tabbar" aria-label="Sections">
    <a href="#top">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      <span data-i18n="nav.home"></span>
    </a>
    <a href="#about">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span data-i18n="nav.about"></span>
    </a>
    <a href="#experience">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
      <span data-i18n="nav.exp"></span>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/></svg>
      <span data-i18n="nav.edu"></span>
    </a>
  </nav>

  <script>
    const I18N = {
      ko: {
        title: "김서연 | KIMSEOYEON - 金谞延",
        "nav.home": "홈",
        "nav.about": "소개",
        "nav.exp": "경험",
        "nav.edu": "학력",

    const HTML_LANG = { ko: "ko", zh: "zh-Hans", en: "en", ja: "ja" };

    function setLanguage(lang) {
      const dict = I18N[lang] || I18N.ko;
      document.documentElement.lang = HTML_LANG[lang] || "ko";
      document.title = dict.title;
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const value = dict[el.dataset.i18n];
        if (value !== undefined) el.innerHTML = value;
      });
      document.querySelectorAll(".lang-switch button").forEach(btn => {
        btn.setAttribute("aria-pressed", String(btn.dataset.lang === lang));
      });
      try { localStorage.setItem("lang", lang); } catch (e) {}
    }

    document.querySelectorAll(".lang-switch button").forEach(btn => {
      btn.addEventListener("click", () => setLanguage(btn.dataset.lang));
    });

    let saved = null;
    try { saved = localStorage.getItem("lang"); } catch (e) {}
    setLanguage(I18N[saved] ? saved : "ko");
  </script>
