<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>김서연 | KIMSEOYEON - 金谞延</title>
  <meta name="description" content="김서연(KIMSEOYEON · 金谞延) 포트폴리오 — 한국과 세계를 잇는 사람">
  <link rel="canonical" href="https://zhujuu.github.io/zhujuu/">

  <!-- 한글 / 중국어 간체 / 일본어 / 영문 웹폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --navy: #0b1f4b;
      --navy-2: #16306a;
      --soft: #5a6a8e;
      --line: #e3e7f0;
      --tint: #f3f5fa;
      --grey: #dde2ec;
      --sky: #e3f1fc;
      --radius: 20px;
      --font-ko: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
      --font-zh: "Noto Sans SC", "Microsoft YaHei", "微软雅黑", "PingFang SC", "SimSun", sans-serif;
      --font-ja: "Noto Sans JP", "Yu Gothic", "游ゴシック", "Hiragino Sans", "Meiryo", sans-serif;
      --font-en: "Poppins", var(--font-ko);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; scroll-padding-top: 76px; }

    body {
      background: var(--bg);
      color: var(--navy);
      font-family: var(--font-ko);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      word-break: keep-all;
    }

    /* 선택한 언어에 맞는 글꼴 — 한자·가나가 깨지지 않도록 */
    html:lang(zh) body { font-family: var(--font-zh); word-break: normal; }
    html:lang(ja) body { font-family: var(--font-ja); word-break: normal; }
    .zh, [lang="zh-Hans"] { font-family: var(--font-zh); }
    .latin { font-family: var(--font-en); }
    .nowrap { white-space: nowrap; }

    a { color: inherit; }
    .container { max-width: 1080px; margin: 0 auto; padding: 0 24px; }

    /* ---------- 상단 바 + 언어 버튼 ---------- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }
    .topbar .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      height: 64px;
    }
    .logo {
      font-weight: 700;
      font-size: 18px;
      text-decoration: none;
      white-space: nowrap;
    }
    .nav-links { display: flex; gap: 24px; font-size: 14px; font-weight: 500; }
    .nav-links a { text-decoration: none; color: var(--soft); }
    .nav-links a:hover { color: var(--navy); }

    .lang-switch {
      display: flex;
      gap: 4px;
      padding: 4px;
      background: var(--tint);
      border-radius: 999px;
    }
    .lang-switch button {
      border: 0;
      background: transparent;
      color: var(--soft);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: background .2s, color .2s;
    }
    .lang-switch button[data-lang="ko"] { font-family: var(--font-ko); }
    .lang-switch button[data-lang="zh"] { font-family: var(--font-zh); }
    .lang-switch button[data-lang="en"] { font-family: var(--font-en); }
    .lang-switch button[data-lang="ja"] { font-family: var(--font-ja); }
    .lang-switch button:hover { color: var(--navy); }
    .lang-switch button[aria-pressed="true"] {
      background: var(--navy);
      color: #fff;
    }

    /* ---------- 히어로 ---------- */
    .hero {
      background: var(--sky);
      color: var(--navy);
      padding: 72px 0 88px;
      overflow: hidden;
    }
    .hero .container {
      display: grid;
      grid-template-columns: minmax(0, 0.7fr) minmax(0, 1.3fr);
      gap: 48px;
      align-items: center;
    }
    .eyebrow {
      font-family: var(--font-en);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.24em;
      color: var(--soft);
      margin-bottom: 16px;
    }
    .hero h1 {
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 500;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }
    .hero h1 strong { font-weight: 900; }
    .hero .desc {
      margin-top: 24px;
      font-size: 16px;
      color: var(--navy-2);
      max-width: 560px;
    }
    .hero .desc strong { color: var(--navy); font-weight: 700; }
    .hero .buttons { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: transform .2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-light { background: var(--navy); color: #fff; }
    .btn-outline { border: 1.5px solid var(--navy); color: var(--navy); background: #fff; }
    .btn-pdf { display: inline-flex; align-items: center; gap: 6px; }

    .photo-card {
      justify-self: center;
      width: 100%;
      max-width: 280px;
      background: #fff;
      padding: 10px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(11, 31, 75, 0.15);
    }
    .photo-card img {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: 16px;
    }

    /* ---------- 섹션 공통 ---------- */
    section.block { padding: 88px 0 0; }
    .section-title {
      font-family: var(--font-en);
      font-size: clamp(28px, 4vw, 36px);
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.02em;
    }
    .section-sub {
      text-align: center;
      color: var(--soft);
      font-size: 14px;
      margin-top: 4px;
    }
    .sub-title {
      font-size: 22px;
      font-weight: 700;
      padding-bottom: 12px;
      margin-bottom: 28px;
      border-bottom: 2px solid var(--navy);
      display: inline-block;
    }

    /* ---------- ABOUT ME 표 (사진2) ---------- */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 40px;
      align-items: start;
    }
    .info-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--line);
    }
    .info-table th, .info-table td {
      padding: 16px 20px;
      text-align: left;
      font-size: 15px;
      vertical-align: middle;
    }
    .info-table tr + tr th, .info-table tr + tr td { border-top: 1px solid var(--line); }
    .info-table th {
      width: 34%;
      background: var(--navy);
      color: #fff;
      font-weight: 500;
      font-size: 14px;
    }
    .info-table tr + tr th { border-top-color: rgba(255,255,255,.12); }
    .info-table td { font-weight: 500; overflow-wrap: anywhere; }
    .info-table td a { text-decoration: none; border-bottom: 1px solid var(--grey); }

    /* 좌우명 */
    .about-left { display: grid; gap: 20px; }
    .motto-card {
      position: relative;
      background: var(--sky);
      border-radius: var(--radius);
      padding: 24px 28px 26px;
      overflow: hidden;
    }
    .motto-card::before {
      content: "\201C";
      position: absolute;
      right: 18px;
      top: -18px;
      font-family: Georgia, serif;
      font-size: 120px;
      line-height: 1;
      color: rgba(11, 31, 75, 0.08);
    }
    .motto-label { font-size: 13px; font-weight: 700; color: var(--soft); letter-spacing: 0.04em; }
    .motto-text { position: relative; font-size: 24px; font-weight: 700; line-height: 1.4; margin-top: 6px; }

    /* 스킬 원형 칩 (사진1 카테고리) */
    .skills-card {
      background: var(--tint);
      border-radius: var(--radius);
      padding: 28px 24px;
    }
    .skills-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 20px; }
    .skills-card .chips + h3 { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--grey); }
    .chips { display: flex; flex-wrap: wrap; gap: 20px; }
    .chip { text-align: center; width: 112px; }
    .chip .circle {
      width: 72px;
      height: 72px;
      margin: 0 auto 8px;
      border-radius: 50%;
      background: #fff;
      border: 6px solid var(--grey);
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 700;
    }
    .chip.primary .circle { background: var(--navy); border-color: #c9d3ea; color: #fff; }
    .chip .name { font-size: 14px; font-weight: 700; display: block; }
    .chip .note { font-size: 12px; color: var(--soft); display: block; line-height: 1.4; }

    /* ---------- 경험 카드 (사진1 추천 메뉴 카드) ---------- */
    .cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      margin-top: 40px;
    }
    .card {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      border: 1.5px solid var(--navy);
      border-radius: var(--radius);
      overflow: hidden;
      background: #fff;
    }
    .card .body { align-self: center; }
    .card .thumb {
      min-height: 120px;
      background: var(--grey);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 20px 24px;
    }
    .card .thumb .program {
      font-size: 40px;
      font-weight: 900;
      line-height: 1.15;
      color: var(--navy-2);
    }
    .card .thumb .year {
      font-family: var(--font-en);
      font-weight: 600;
      font-size: 14px;
      background: #fff;
      border-radius: 999px;
      padding: 4px 12px;
    }
    .card .body { padding: 20px 24px 24px; }
    .card .body h4 { font-size: 18px; font-weight: 700; }
    .card .body p { font-size: 14px; color: var(--soft); }
    .card .body .dates { font-family: var(--font-en); }

    /* ---------- 어학연수 카드 안의 발표 자료 ---------- */
    .card-pres {
      grid-column: 1 / -1;
      background: var(--tint);
      border-top: 1px solid var(--line);
      padding: 24px;
    }
    .card-pres-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .count-badge {
      font-family: var(--font-en);
      font-size: 12px;
      background: var(--navy);
      color: #fff;
      border-radius: 999px;
      padding: 0 9px;
    }
    .pres-list { display: grid; gap: 20px; }
    .pres-card {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
      border: 1px solid var(--grey);
      border-radius: var(--radius);
      overflow: hidden;
      background: #fff;
    }
    .viewer {
      position: relative;
      background: var(--grey);
      aspect-ratio: 16 / 9;
      border-right: 1px solid var(--line);
    }
    .viewer img { display: block; width: 100%; height: 100%; object-fit: contain; background: #fff; }
    .viewer .nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: rgba(11, 31, 75, 0.82);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background .2s, opacity .2s;
    }
    .viewer .nav:hover { background: var(--navy); }
    .viewer .nav:disabled { opacity: 0; pointer-events: none; }
    .viewer .nav svg { width: 20px; height: 20px; }
    .viewer .prev { left: 12px; }
    .viewer .next { right: 12px; }
    .viewer .counter {
      position: absolute;
      right: 12px;
      bottom: 12px;
      font-family: var(--font-en);
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      background: rgba(11, 31, 75, 0.82);
      border-radius: 999px;
      padding: 2px 10px;
    }
    .pres-info { padding: 24px 28px; display: flex; flex-direction: column; }
    .pres-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .pres-tags span { font-size: 12px; font-weight: 700; background: var(--tint); border-radius: 999px; padding: 3px 10px; }
    .pres-tags span.dark { background: var(--navy); color: #fff; }
    .pres-info h4 { font-family: var(--font-zh); font-size: 22px; font-weight: 700; line-height: 1.35; }
    .pres-title-tr { font-size: 14px; font-weight: 500; color: var(--soft); margin-top: 2px; }
    .pres-desc { font-size: 15px; margin-top: 14px; }
    .pres-meta { font-size: 13px; color: var(--soft); margin-top: 12px; }
    .pres-link {
      align-self: flex-start;
      margin-top: auto;
      padding-top: 16px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }
    .pres-link::after { content: " →"; }
    .pres-link:hover { text-decoration: underline; }

    /* ---------- 학력 · 자격증 타임라인 (사진2) ---------- */
    .timeline-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
    }
    .timeline { list-style: none; position: relative; }
    .timeline li {
      position: relative;
      padding-left: 56px;
      padding-bottom: 28px;
    }
    .timeline li::before {
      content: "";
      position: absolute;
      left: 15px;
      top: 32px;
      bottom: 0;
      width: 2px;
      background: var(--line);
    }
    .timeline li:last-child::before { display: none; }
    .timeline .check {
      position: absolute;
      left: 0;
      top: 2px;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--navy);
      display: grid;
      place-items: center;
    }
    .timeline h4 { font-size: 18px; font-weight: 700; line-height: 1.5; }
    .timeline h4 .tag {
      font-size: 12px;
      font-weight: 500;
      background: var(--tint);
      border-radius: 999px;
      padding: 2px 10px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .timeline p { font-size: 14px; color: var(--soft); }
    .timeline .when { font-family: var(--font-en); font-size: 13px; font-weight: 600; color: var(--navy); }

    /* ---------- 푸터 ---------- */
    footer {
      margin-top: 96px;
      padding: 32px 0;
      border-top: 1px solid var(--line);
      font-size: 13px;
      color: var(--soft);
      text-align: center;
    }

    /* ---------- 모바일 하단 탭 (사진1) ---------- */
    .tabbar { display: none; }

    @media (max-width: 860px) {
      .nav-links { display: none; }
      .hero { padding: 48px 0 56px; }
      .hero .container { grid-template-columns: 1fr; gap: 32px; }
      .photo-card { max-width: 200px; justify-self: start; }
      .about-grid, .timeline-grid { grid-template-columns: 1fr; }
      .card { grid-template-columns: 1fr; }
      .card-pres { padding: 16px; }
      .pres-card { grid-template-columns: 1fr; }
      .viewer { border-right: 0; border-bottom: 1px solid var(--line); }
      .pres-info { padding: 20px; }
    }

    @media (max-width: 600px) {
      .container { padding: 0 16px; }
      .topbar .container { height: auto; padding-top: 10px; padding-bottom: 10px; flex-wrap: wrap; }
      .logo { font-size: 16px; }
      .lang-switch { width: 100%; justify-content: space-between; }
      .lang-switch button { flex: 1; padding: 6px 4px; }
      html { scroll-padding-top: 108px; }
      .info-table th, .info-table td { padding: 14px 14px; }
      .card .thumb .program { font-size: 30px; }
      section.block { padding-top: 64px; }

      body { padding-bottom: 72px; }
      .tabbar {
        display: flex;
        position: fixed;
        left: 0; right: 0; bottom: 0;
        z-index: 20;
        background: #fff;
        border-top: 1px solid var(--line);
        border-radius: 20px 20px 0 0;
        box-shadow: 0 -6px 20px rgba(11, 31, 75, 0.06);
        padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      }
      .tabbar a {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        font-size: 11px;
        color: var(--soft);
        text-decoration: none;
      }
      .tabbar svg { width: 22px; height: 22px; }
      footer { margin-top: 64px; }
    }

    /* ---------- 인쇄 / 이력서 PDF ---------- */
    @media print {
      @page { size: A4; margin: 10mm 12mm; }
      html { scroll-behavior: auto; }
      body { padding-bottom: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .topbar, .tabbar, .hero .buttons { display: none !important; }
      .container { max-width: none; padding: 0; }
      .hero { padding: 24px 28px; border-radius: 16px; }
      .hero .container { grid-template-columns: 140px minmax(0, 1fr); gap: 28px; }
      .photo-card { max-width: 140px; padding: 5px; box-shadow: none; justify-self: start; }
      .hero h1 { font-size: 28px; }
      .hero .desc { font-size: 12.5px; margin-top: 14px; }
      section.block { padding-top: 20px; }
      .hero h1 { line-height: 1.25; }
      .section-title { font-size: 22px; }
      .section-sub { display: none; }
      .about-grid, .timeline-grid { grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 14px; }
      .info-table th, .info-table td { padding: 10px 14px; font-size: 13px; }
      .skills-card { padding: 14px 18px; }
      .skills-card h3 { margin-bottom: 8px; }
      .skills-card .chips { flex-direction: column; gap: 6px; }
      .skills-card .chips:first-of-type { flex-direction: row; flex-wrap: wrap; gap: 6px 18px; }
      .skills-card .chips:first-of-type .note { display: none; }
      .motto-card { padding: 12px 18px; }
      .motto-text { font-size: 17px; margin-top: 2px; }
      .motto-card::before { font-size: 80px; top: -12px; }
      .about-left { gap: 12px; }
      .skills-card .chips + h3 { margin-top: 12px; padding-top: 10px; }
      .chip { width: auto; display: flex; align-items: center; gap: 10px; text-align: left; }
      .chip .circle { width: 34px; height: 34px; margin: 0; border-width: 3px; font-size: 13px; flex: none; }
      .chip .name { font-size: 13px; white-space: nowrap; }
      .chip .note { font-size: 12px; }
      .section-title { break-after: avoid; }
      footer { display: none; }
      .sub-title { font-size: 16px; padding-bottom: 6px; margin-bottom: 12px; }
      .timeline li { padding-bottom: 4px; }
      .timeline h4 { font-size: 15px; }
      .timeline p { font-size: 12.5px; }
      .hero { padding: 20px 28px; }
      .hero .desc { line-height: 1.6; }
      .cards { display: grid; grid-template-columns: 1fr 1fr; overflow: visible; margin: 14px 0 0; padding: 0; gap: 16px; }
      .card { break-inside: avoid; display: block; }
      .card .thumb { min-height: 0; height: 70px; padding: 12px 18px; }
      .card .thumb .program { font-size: 24px; }
      .card .body { padding: 12px 18px 16px; }
      #presentation { display: none; }
    }
  </style>
</head>
<body>

  <!-- 상단: 이름 + 메뉴 + 언어 버튼 -->
  <header class="topbar">
    <div class="container">
      <a class="logo" href="#top" data-i18n="name"></a>
      <nav class="nav-links" aria-label="Sections">
        <a href="#about" data-i18n="nav.about"></a>
        <a href="#education" data-i18n="nav.edu"></a>
        <a href="#experience" data-i18n="nav.exp"></a>
        <a href="#presentation" data-i18n="nav.pres"></a>
      </nav>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="ko" lang="ko">한국어</button>
        <button type="button" data-lang="zh" lang="zh-Hans">中文</button>
        <button type="button" data-lang="en" lang="en">English</button>
        <button type="button" data-lang="ja" lang="ja">日本語</button>
      </div>
    </div>
  </header>

  <main id="top">
    <!-- 히어로 -->
    <section class="hero">
      <div class="container">
        <div class="photo-card">
          <img id="profile-photo" src="images/profile.png" alt="김서연">
        </div>
        <div>
          <p class="eyebrow">PORTFOLIO</p>
          <h1><span data-i18n="hero.hello"></span><br><span data-i18n="hero.title"></span></h1>
          <p class="desc" data-i18n="hero.desc"></p>
          <div class="buttons">
            <a class="btn btn-light" href="mailto:rlatjdus129@naver.com" data-i18n="btn.contact"></a>
            <a class="btn btn-outline" href="#about" data-i18n="btn.more"></a>

    const HTML_LANG = { ko: "ko", zh: "zh-Hans", en: "en", ja: "ja" };

    function setLanguage(lang) {
      const dict = I18N[lang] || I18N.ko;
      document.documentElement.lang = HTML_LANG[lang] || "ko";
      document.title = dict.title;
      document.getElementById("profile-photo").alt = dict.name;
      const resume = document.getElementById("resume-link");
      resume.href = "resume/KIMSEOYEON_resume_" + lang + ".pdf";
      resume.setAttribute("download", "KIMSEOYEON_resume_" + lang + ".pdf");
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const value = dict[el.dataset.i18n];
        if (value !== undefined) el.innerHTML = value;
      });
      document.querySelectorAll(".lang-switch button").forEach(btn => {
        btn.setAttribute("aria-pressed", String(btn.dataset.lang === lang));
      });
      try { localStorage.setItem("lang", lang); } catch (e) {}
    }

    document.querySelectorAll(".lang-switch button").forEach(btn => {
      btn.addEventListener("click", () => setLanguage(btn.dataset.lang));
    });

    // 발표 슬라이드 넘기기
    document.querySelectorAll(".viewer").forEach(viewer => {
      const img = viewer.querySelector("img");
      const prev = viewer.querySelector(".prev");
      const next = viewer.querySelector(".next");
      const counter = viewer.querySelector(".counter");
      const total = Number(viewer.dataset.count);
      let index = 1;
      const show = () => {
        img.src = viewer.dataset.dir + "/" + String(index).padStart(2, "0") + ".jpg";
        counter.textContent = index + " / " + total;
        prev.disabled = index === 1;
        next.disabled = index === total;
      };
      prev.addEventListener("click", () => { if (index > 1) { index--; show(); } });
      next.addEventListener("click", () => { if (index < total) { index++; show(); } });
      show();
    });

    // 주소 뒤에 ?lang=zh 처럼 붙이면 그 언어로 열림
    let saved = new URLSearchParams(location.search).get("lang");
    if (!I18N[saved]) {
      try { saved = localStorage.getItem("lang"); } catch (e) {}
    }
    setLanguage(I18N[saved] ? saved : "ko");
  </script>
