<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e8">
  <meta name="description" content="김서연(KIMSEOYEON), 경기대학교 경영학·중어중문학 복수전공 소개 페이지입니다.">
  <title>김서연 | KIMSEOYEON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f1e8;
      --ink: #183b36;
      --muted: #68736b;
      --line: #c9cec1;
      --coral: #df684e;
      --lime: #d5df72;
      --serif: "Noto Serif KR", "Noto Serif SC", Georgia, serif;
      --sans: "DM Sans", "Noto Serif KR", sans-serif;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    button, a { font: inherit; }
    a { color: inherit; }
    [hidden] { display: none !important; }

    .page-shell {
      width: min(1320px, calc(100% - 96px));
      margin: 0 auto;
    }

    .masthead {
      min-height: 88px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .monogram {
      width: 36px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 1px solid var(--ink);
      border-radius: 50%;
      font-size: 11px;
    }

    .wordmark-copy { display: grid; gap: 3px; }
    .wordmark-copy small { color: var(--muted); font-size: 9px; font-weight: 500; }

    .language-switch {
      display: flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
    }

    .language-switch button {
      min-width: 62px;
      min-height: 34px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .language-switch button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--paper);
    }

    button:focus-visible, a:focus-visible {
      outline: 3px solid var(--coral);
      outline-offset: 3px;
    }

    .hero {
      min-height: 600px;
      display: grid;
      grid-template-columns: 1.08fr 0.82fr;
      align-items: center;
      gap: 8%;
      padding: 66px 0 76px;
    }

    .hero-copy { padding: 12px 0; }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 32px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }

    .eyebrow-number {
      color: var(--coral);
      font-family: "DM Sans", sans-serif;
      font-size: 12px;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: 112px;
      font-weight: 500;
      line-height: 1.12;
      letter-spacing: 0;
      word-break: keep-all;
    }

    .hanja {
      display: block;
      margin-top: 9px;
      color: var(--coral);
      font-size: 45px;
      line-height: 1.3;
    }

    .romanized {
      margin: 26px 0 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .intro {
      max-width: 460px;
      margin: 32px 0 0;
      font-family: var(--serif);
      font-size: 21px;
      line-height: 1.8;
      word-break: keep-all;
    }

    .hero-visual {
      position: relative;
      min-height: 440px;
      aspect-ratio: 0.88;
      background: #d9d5c9;
    }

    .hero-visual img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .image-label {
      position: absolute;
      right: -18px;
      bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 0 16px;
      background: var(--lime);
      color: var(--ink);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .image-label-mark {
      display: grid;
      width: 25px;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid currentColor;
      border-radius: 50%;
      font-family: var(--serif);
      font-size: 13px;
    }

    .background {
      display: grid;
      grid-template-columns: 0.7fr 1.3fr;
      gap: 8%;
      padding: 42px 0 54px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .section-kicker {
      margin: 4px 0 0;
      color: var(--coral);
      font-size: 11px;
      font-weight: 700;
    }

    .background h2 {
      margin: 11px 0 0;
      font-family: var(--serif);
      font-size: 30px;
      font-weight: 500;
      line-height: 1.4;
    }

    .details { margin: 0; }

    .detail-row {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 24px;
      padding: 17px 0;
      border-bottom: 1px solid var(--line);
    }

    .detail-row:first-child { padding-top: 5px; }
    .detail-row:last-child { padding-bottom: 5px; border-bottom: 0; }

    .detail-row dt {
      color: var(--muted);
      font-size: 12px;
    }

    .detail-row dd {
      margin: 0;
      font-family: var(--serif);
      font-size: 17px;
      line-height: 1.6;
      word-break: keep-all;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 23px 0 30px;
      color: var(--muted);
      font-size: 10px;
    }

    .footer p { margin: 0; }

    @media (max-width: 820px) {
      .page-shell { width: min(100% - 48px, 620px); }
      .hero { min-height: auto; grid-template-columns: 1fr 0.8fr; gap: 6%; padding: 58px 0; }
      h1 { font-size: 76px; }
      .hanja { font-size: 36px; }
      .intro { font-size: 18px; }
      .hero-visual { min-height: 360px; }
      .background { grid-template-columns: 0.75fr 1.25fr; gap: 6%; }
      .detail-row { grid-template-columns: 110px 1fr; gap: 16px; }
    }

    @media (max-width: 600px) {
      .page-shell { width: calc(100% - 40px); }
      .masthead { min-height: 76px; }
      .wordmark { gap: 9px; font-size: 11px; }
      .monogram { width: 32px; }
      .wordmark-copy small { font-size: 8px; }
      .language-switch button { min-width: 52px; min-height: 32px; padding: 0 9px; font-size: 11px; }
      .hero { grid-template-columns: 1fr; gap: 34px; padding: 46px 0 48px; }
      .eyebrow { margin-bottom: 24px; }
      h1 { font-size: 68px; }
      .hanja { margin-top: 4px; font-size: 32px; }
      .romanized { margin-top: 19px; }
      .intro { margin-top: 24px; font-size: 18px; }
      .hero-visual { width: calc(100% - 10px); min-height: 0; aspect-ratio: 1.16; }
      .image-label { right: -10px; bottom: 16px; }
      .background { grid-template-columns: 1fr; gap: 24px; padding: 30px 0 34px; }
      .background h2 { font-size: 26px; }
      .detail-row { grid-template-columns: 100px 1fr; gap: 12px; padding: 15px 0; }
      .detail-row dd { font-size: 15px; }
      .footer { padding-top: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="masthead">
      <a class="wordmark" href="#home" aria-label="김서연 소개 페이지 맨 위로">
        <span class="monogram" aria-hidden="true">KS</span>
        <span class="wordmark-copy">SEOYEON KIM<small>PERSONAL PROFILE</small></span>
      </a>
      <div class="language-switch" role="group" aria-label="언어 선택 / 选择语言">
        <button type="button" data-language="ko" aria-pressed="true">한국어</button>
        <button type="button" data-language="zh" aria-pressed="false">中文</button>
      </div>
    </header>

    <main id="home">
      <section class="hero" aria-label="프로필 소개">
        <div class="hero-copy">
          <p class="eyebrow"><span class="eyebrow-number">01</span><span data-copy="ko">자기소개</span><span data-copy="zh" hidden>个人介绍</span></p>
          <div data-language-panel="ko">
            <h1>김서연<span class="hanja">金谞延</span></h1>
            <p class="romanized">KIMSEOYEON</p>
            <p class="intro">경영학과 중어중문학을 함께 공부합니다.</p>
          </div>
          <div data-language-panel="zh" hidden>
            <h1>金谞延<span class="hanja">김서연</span></h1>
            <p class="romanized">KIMSEOYEON</p>
            <p class="intro">我在京畿大学学习工商管理与中国语言文学。</p>
          </div>
        </div>
        <div class="hero-visual">
          <img src="https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?auto=format&amp;fit=crop&amp;w=1200&amp;q=85" alt="책과 공부 공간을 담은 사진">
          <div class="image-label"><span class="image-label-mark" aria-hidden="true">學</span><span>BUSINESS · LANGUAGE</span></div>
        </div>
      </section>

      <section class="background" aria-label="학력 및 전공">
        <div>
          <p class="section-kicker">BACKGROUND / 02</p>
          <div data-language-panel="ko"><h2>학력 및 전공</h2></div>
          <div data-language-panel="zh" hidden><h2>学历与专业</h2></div>
        </div>
        <dl class="details">
          <div class="detail-row">
            <dt><span data-copy="ko">학교</span><span data-copy="zh" hidden>学校</span></dt>
            <dd><span data-copy="ko">경기대학교</span><span data-copy="zh" hidden>京畿大学</span></dd>
          </div>
          <div class="detail-row">
            <dt><span data-copy="ko">본전공</span><span data-copy="zh" hidden>主修</span></dt>
            <dd><span data-copy="ko">경영학</span><span data-copy="zh" hidden>工商管理</span></dd>
          </div>
          <div class="detail-row">
            <dt><span data-copy="ko">복수전공</span><span data-copy="zh" hidden>双专业</span></dt>
            <dd><span data-copy="ko">중어중문학</span><span data-copy="zh" hidden>中国语言文学</span></dd>
          </div>
        </dl>
      </section>
    </main>

    <footer class="footer">
      <p>김서연 · 金谞延</p>
      <p>KIMSEOYEON / 2026</p>
    </footer>
  </div>

  <script>
    const languageButtons = document.querySelectorAll("[data-language]");
    const languagePanels = document.querySelectorAll("[data-language-panel]");
    const translatedCopy = document.querySelectorAll("[data-copy]");

    languageButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const language = button.dataset.language;
        document.documentElement.lang = language;
        document.title = language === "ko" ? "김서연 | KIMSEOYEON" : "金谞延 | KIMSEOYEON";

        languageButtons.forEach((item) => {
          item.setAttribute("aria-pressed", String(item === button));
        });
        languagePanels.forEach((panel) => {
          panel.hidden = panel.dataset.languagePanel !== language;
        });
        translatedCopy.forEach((item) => {
          item.hidden = item.dataset.copy !== language;
        });
      });
    });
  </script>
</body>
</html>
